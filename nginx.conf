# nginx vhost interno del container — el nginx del VPS hace proxy_pass aquí,
# pone TLS, compresión (gzip/brotli) y cabeceras de seguridad
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # fuentes autoalojadas: caché larga e inmutable (se versionan por nombre si cambian)
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "https://jrgblanco.com";
        try_files $uri =404;
    }

    location ~* \.(png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # Healthcheck (healthcheck.sh y healthcheck del container)
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No es SPA: cualquier otra ruta → 404 limpio
    location / {
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
